<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ya estás dentro · El Libre Albedrío · Elena Rocha</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Bricolage+Grotesque:wght@300;400&family=Arimo&display=swap">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fbf9f1;color:#2a1a22;font-family:'Arimo',Arial,sans-serif;display:grid;place-items:center;min-height:100svh;padding:48px max(20px,env(safe-area-inset-left,0px)) 48px max(20px,env(safe-area-inset-right,0px))}
main{max-width:620px;text-align:center;display:grid;gap:26px;justify-items:center;animation:in 1s ease both}
.k{margin:0;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:300;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7a6a6f}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(40px,7vw,64px);line-height:1.05;text-wrap:balance}
p.t{margin:0;font-size:16px;line-height:1.7;color:#4a3a40;max-width:46ch}
p.c{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:26px;color:#eb4537}
a.cta{display:inline-flex;align-items:center;gap:14px;margin-top:10px;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:300;font-size:15px;color:#2a1a22;text-decoration:none}
a.cta::before{content:"";width:30px;height:1px;background:currentColor;transition:width .35s}
a.cta:hover::before{width:46px}
.firma{margin-top:18px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
<main>
<p class="k">El Libre Albedrío</p>
<h1>Ya estás dentro</h1>
<p class="t">Gracias por confirmar. A partir de ahora te llegará lo que pienso, lo que siento y lo que cocino, sin prisas y sin ruido</p>
<p class="c">Un ratito a contracorriente</p>
<a class="cta" href="/">Volver a la web</a>
<p class="firma">Elena Rocha</p>
</main>
</body>
</html>
